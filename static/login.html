<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#0E0C1A">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ProjectHub: logowanie</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@600..800&family=DM+Sans:opsz,wght@9..40,400..650&family=JetBrains+Mono&display=swap" rel="stylesheet">
  <script src="js/theme-boot.js"></script>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/themes.css">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath d='M3 9a2 2 0 0 1 2-2h7l3 3h12a2 2 0 0 1 2 2v13a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z' fill='%23FFB65C'/%3E%3C/svg%3E">
</head>
<body>
  <main class="login">
    <div class="login-card">
      <div class="stack" aria-hidden="true">
        <i style="--tab: var(--c0); --r: -7deg; --x: -6px; --y: 6px"></i>
        <i style="--tab: var(--c1); --r: 4deg; --x: 14px; --y: 0"></i>
        <i style="--tab: var(--c3); --r: -1.5deg; --x: 4px; --y: 2px"></i>
      </div>

      <h1 id="title">Zaloguj się</h1>
      <p class="lead" id="lead">Wpisz dane, żeby otworzyć katalog projektów.</p>

      <form id="authForm" novalidate>
        <p class="form-error" id="error" role="alert" hidden></p>

        <div class="field">
          <label for="username">Login</label>
          <input id="username" name="username" autocomplete="username" autocapitalize="none" spellcheck="false" required>
        </div>
        <div class="field">
          <label for="password">Hasło</label>
          <input id="password" name="password" type="password" autocomplete="current-password" required>
          <p class="hint" id="pwHint" hidden>Co najmniej 8 znaków.</p>
        </div>
        <div class="field" id="confirmField" hidden>
          <label for="confirm">Powtórz hasło</label>
          <input id="confirm" name="confirm" type="password" autocomplete="new-password">
        </div>

        <button class="btn btn-primary" id="submit" type="submit">Zaloguj</button>
        <p class="switch-mode" id="switchBox" hidden><span id="switchText"></span> <button type="button" class="linklike" id="switchBtn"></button></p>
        <p class="hint" id="demoNote" hidden>Tryb podglądu: konto powstaje tylko w tej przeglądarce.</p>
        <button class="btn" id="demoBtn" type="button" hidden>Zobacz demo bez zakładania konta</button>
      </form>
    </div>
  </main>

  <script src="js/demo-data.js"></script>
  <script src="js/api.js"></script>
  <script src="js/login.js"></script>
</body>
</html>
