# Run: docker compose up -d   (then http://localhost:8765)
# With your own domain and HTTPS: docker compose --profile https up -d  (fill in the Caddyfile)
services:
  projecthub:
    build: .
    restart: unless-stopped
    environment:
      PROJECTHUB_MODE: hosted
      PROJECTHUB_REGISTRATION: open        # closed = you create the accounts yourself: docker compose exec projecthub python manage.py create-user name
      PROJECTHUB_QUOTA_MB: 500             # storage per account, 0 = no limit
      # PROJECTHUB_ALLOWED_HOSTS: projects.yourdomain.com
      # PROJECTHUB_TRUST_PROXY: "1"        # enable together with the https profile
      # PROJECTHUB_HTTPS: "1"
    ports:
      - "127.0.0.1:8765:8765"   # lokalnie; na serwerze: "8765:8765" razem z profilem https i ALLOWED_HOSTS
    volumes:
      - projecthub-data:/data

  caddy:
    profiles: ["https"]
    image: caddy:2
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
    depends_on: [projecthub]

volumes:
  projecthub-data:
  caddy-data:
